# dsh-holocubic 自带的 loader 补丁。
#
# 当本包被列进 profile 的 `dsh.profile.bundles` 时（README 的安装方式二），
# 宿主会叠加这个文件。如果你同时又在 profile 的 cordis.patch.yml 里 insert
# 同一个 id，插件会被加载两份：第二份发现 17890 已被占用，会退到 17891，
# 于是 /state 和 /events 分散在两个端口上。
#
# 入口的 name 必须是包名：loader 按 entry.name 解析模块，写成 dsh-holocubic
# 会找不到模块，整条 bundle 的挂载被判失败（插件管理器里是
# reason=bundle / application=failed），插件不会加载、17890 也不会监听。
- insert:
    - id: dsh-holocubic
      name: 'dsh-pet-holocubic'
      config:
        # HTTP/SSE 监听端口；被占用时依次尝试 port + 1 .. port + 5。
        port: 17890
        portAttempts: 6
        # SSE 心跳间隔（毫秒），设备端应大于这个值才算断线。
        heartbeatMs: 10000
